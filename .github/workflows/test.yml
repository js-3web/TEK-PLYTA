name: testy
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Porównanie z niezależnym MES (xdfem2d) i audyt DXF (ezdxf)
        run: |
          pip install xdfem2d==2026.10.29 ezdxf==1.4.5
          node tools/export-case.mjs cc.json
          python3 tools/cross-check.py cc.json
          npm test
