# Budowa programu dla Windows — przy pushu, tagu v* albo ręcznie z zakładki Actions.
# Artefakt „TEK-PLYTA-windows”: instalator z jednego pliku (NSIS), wersja przenośna .exe i TEK-PLYTA-klucze.html.
# Testy (w tym porównanie z niezależnym MES) muszą przejść przed budową.
name: exe
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'main', 'master']
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Pobranie binariów Neutralino (wersje z neutralino.config.json; awaryjnie najnowsze)
        run: npx --yes @neutralinojs/neu@11.8.0 update || npx --yes @neutralinojs/neu@11.8.0 update --latest
      - name: Budowa .exe z wbudowanymi zasobami
        run: npx --yes @neutralinojs/neu@11.8.0 build --release --embed-resources
      - name: Instalator (NSIS)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis
          VERSION=$(node -p "require('./package.json').version")
          cd installer && makensis -V2 -DVERSION=$VERSION -DSRC=../dist/TEK-PLYTA -DOUT=../dist tekplyta.nsi
      - name: Pakiet wynikowy
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp dist/TEK-PLYTA-setup-$VERSION.exe out/
          cp dist/TEK-PLYTA/TEK-PLYTA-win_x64.exe out/TEK-PLYTA-$VERSION-przenosna.exe
          cp dist-tools/TEK-PLYTA-klucze.html out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: TEK-PLYTA-windows
          path: out/
          if-no-files-found: error
